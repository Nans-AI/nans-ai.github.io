<!DOCTYPE html>
<html lang="id" data-theme="obsidian">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nans Dev AI — Diana</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <button id="menu-btn" class="icon-btn" aria-label="Menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M4 7h16M4 12h12M4 17h16"/></svg>
      </button>
      <div class="brand-title">
        <span class="pulse-dot"></span>
        <span>Nans Dev AI</span>
      </div>
      <button id="new-chat-btn" class="icon-btn" title="Obrolan Baru" aria-label="Obrolan Baru">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 5v14M5 12h14"/></svg>
      </button>
    </header>

    <main id="chat-area" class="chat-area">
      <div id="hero-welcome" class="hero-welcome">
        <div class="hero-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3l1.9 5.8a2 2 0 001.3 1.3L21 12l-5.8 1.9a2 2 0 00-1.3 1.3L12 21l-1.9-5.8a2 2 0 00-1.3-1.3L3 12l5.8-1.9a2 2 0 001.3-1.3L12 3z"/></svg>
        </div>
        <div class="hero-badge">DIANA ENGINE v2.0</div>
        <h1>Ada yang bisa Diana bantu?</h1>
        <p>Tanya arsitektur kode, ide bisnis, atau ngobrol santai bareng asisten cerdas Nans Dev.</p>
      </div>
      <div id="chat-messages" class="chat-messages"></div>
    </main>

    <footer class="composer-wrap">
      <div class="composer-box">
        <input type="text" id="user-input" placeholder="Kirim pesan ke Diana..." autocomplete="off" />
        <button id="send-btn" class="send-btn" aria-label="Kirim">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M5 12h14M13 6l6 6-6 6"/></svg>
        </button>
      </div>
    </footer>
  </div>

  <!-- Sidebar Drawer Menu Hamburger -->
  <div id="drawer-backdrop" class="drawer-backdrop hidden"></div>
  <aside id="nav-drawer" class="nav-drawer">
    <div class="drawer-head">
      <h2>Pengaturan Sistem</h2>
      <button id="close-drawer" class="icon-btn" aria-label="Tutup">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>

    <div class="drawer-section">
      <span class="section-label">TEMA TAMPILAN</span>
      <div class="theme-grid">
        <button class="theme-chip active" data-set-theme="obsidian">
          <span class="swatch swatch-obsidian"></span><span>Obsidian</span>
        </button>
        <button class="theme-chip" data-set-theme="emerald">
          <span class="swatch swatch-emerald"></span><span>Emerald</span>
        </button>
        <button class="theme-chip" data-set-theme="crimson">
          <span class="swatch swatch-crimson"></span><span>Crimson</span>
        </button>
        <button class="theme-chip" data-set-theme="royal">
          <span class="swatch swatch-royal"></span><span>Royal</span>
        </button>
      </div>
    </div>

    <div class="drawer-section">
      <span class="section-label">AKSES MODE BOS</span>
      <div id="boss-status" class="status-pill">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
        <span>Mode Tamu (Limit Aktif)</span>
      </div>
      <input type="password" id="boss-code-input" placeholder="Masukkan Kode Mode Bos..." />
      <button id="verify-boss-btn" class="primary-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>
        <span>Aktifkan Mode Bos</span>
      </button>
    </div>

    <div class="drawer-section drawer-footer">
      <button id="clear-history-btn" class="danger-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
        <span>Hapus Riwayat Chat</span>
      </button>
    </div>
  </aside>

  <script type="module" src="./app.js"></script>
</body>
</html>
