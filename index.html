<!DOCTYPE html>
<html lang="id" data-theme="obsidian">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nans Dev AI — Diana</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <button id="menu-btn" class="icon-btn" aria-label="Menu">☰</button>
      <div class="brand-title">
        <span class="pulse-dot"></span>
        <span>Nans Dev AI</span>
      </div>
      <button id="new-chat-btn" class="icon-btn" title="Obrolan Baru">＋</button>
    </header>

    <main id="chat-area" class="chat-area">
      <div id="hero-welcome" class="hero-welcome">
        <div class="hero-badge">DIANA ENGINE v2.0</div>
        <h1>Ada yang bisa Diana bantu?</h1>
        <p>Tanya coding, ide bisnis, atau ngobrol santai bareng asisten Nans Dev.</p>
      </div>
      <div id="chat-messages" class="chat-messages"></div>
    </main>

    <footer class="composer-wrap">
      <div class="composer-box">
        <input type="text" id="user-input" placeholder="Kirim pesan ke Diana..." autocomplete="off" />
        <button id="send-btn" class="send-btn" aria-label="Kirim">➤</button>
      </div>
    </footer>
  </div>

  <!-- Sidebar Drawer Menu Hamburger -->
  <div id="drawer-backdrop" class="drawer-backdrop hidden"></div>
  <aside id="nav-drawer" class="nav-drawer">
    <div class="drawer-head">
      <h2>Menu & Pengaturan</h2>
      <button id="close-drawer" class="icon-btn">✕</button>
    </div>

    <div class="drawer-section">
      <span class="section-label">TEMA TAMPILAN (4 WARNA)</span>
      <div class="theme-grid">
        <button class="theme-chip active" data-set-theme="obsidian">🌑 Obsidian</button>
        <button class="theme-chip" data-set-theme="emerald">🌲 Emerald</button>
        <button class="theme-chip" data-set-theme="crimson">🍷 Crimson</button>
        <button class="theme-chip" data-set-theme="royal">🌌 Royal</button>
      </div>
    </div>

    <div class="drawer-section">
      <span class="section-label">AKSES MODE BOS</span>
      <p id="boss-status" class="status-note">Status: Mode Tamu (Limit Aktif)</p>
      <input type="password" id="boss-code-input" placeholder="Masukkan Kode Mode Bos..." />
      <button id="verify-boss-btn" class="primary-btn">Aktifkan Mode Bos</button>
    </div>

    <div class="drawer-section">
      <button id="clear-history-btn" class="danger-btn">🗑️ Hapus Riwayat Chat</button>
    </div>
  </aside>

  <script type="module" src="./app.js"></script>
</body>
</html>
